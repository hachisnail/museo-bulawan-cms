worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;
        root /app;
        index index.html;

        location / {
            # Attempt to serve the request as a physical file, then as a directory.
            # Fall back to index.html to allow React Router (BrowserRouter) to handle the route.
            try_files $uri $uri/ /index.html;
        }

        # Cache control for static assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
            expires 1M;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Prevent access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
